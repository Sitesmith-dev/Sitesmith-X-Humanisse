<!-- Supabase > Authentication > Emails > Templates > Reset password
     Subject: Reset your Humanisse password -->
<div style="background:#FFF7E3;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#151014">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:3px solid #151014;border-radius:16px;padding:32px">
    <p style="margin:0 0 24px;font-size:22px;font-weight:800">Humanisse</p>
    <h1 style="margin:0 0 12px;font-size:24px">Reset your password</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Tap the button below to choose a new password. The link works once and expires after an hour.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/login/reset"
       style="display:inline-block;background:#FBC44D;color:#151014;border:3px solid #151014;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:700;text-decoration:none">Choose a new password</a>
    <p style="margin:24px 0 0;font-size:14px;line-height:1.5;color:#5a5258">If you didn't ask to reset your password, you can ignore this email. Your password won't change.</p>
  </div>
</div>
